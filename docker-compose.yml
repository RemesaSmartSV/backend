services:
  # 1. Base de datos PostgreSQL (Desarrollo)
  postgres_db:
    image: postgres:16-alpine
    container_name: remesasmart_postgres
    restart: always
    environment:
      POSTGRES_DB: RemesaSmartDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - remesa_network

  # 2. Base de datos PostgreSQL (Pruebas unitarias / Integracion)
  postgres_test_db:
    image: postgres:16-alpine
    container_name: remesasmart_postgres_test
    restart: always
    environment:
      POSTGRES_DB: RemesaSmartDB_Test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - remesa_network

  # 3. Backend .NET 8
  backend_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remesasmart_backend
    restart: on-failure
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - UseHttpsRedirection=false
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=RemesaSmartDB;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__TestConnection=Host=postgres_test_db;Port=5432;Database=RemesaSmartDB_Test;Username=postgres;Password=${POSTGRES_PASSWORD}
      # La clave JWT nunca vive en el repositorio: viene de .env (no trackeado).
      - Jwt__Key=${JWT_KEY:?JWT_KEY es obligatorio. Copia .env.example a .env y completa JWT_KEY}
      - Jwt__Issuer=RemesaSmartSV
      - Jwt__Audience=RemesaSmartSVClient
      # Nombre de variable esperado por Program.cs (CORS_ORIGINS_PROD).
      - CORS_ORIGINS_PROD=${CORS_ORIGINS_PROD:-http://localhost:5173}
    ports:
      - "8080:8080"
    networks:
      - remesa_network

  # 4. Frontend React
  # Detras del perfil "frontend" a proposito: un clon limpio de SOLO backend
  # no tiene el repo hermano y "docker compose up --build" fallaria al construir
  # el contexto ../frontend. Con perfil, el stack base levanta solo y la demo
  # completa se pide explicitamente (issue Organizacion #82 / DEMO-01).
  frontend_web:
    profiles: ["frontend"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: remesasmart_frontend
    restart: on-failure
    depends_on:
      - backend_api
    ports:
      - "5173:80"
    networks:
      - remesa_network

volumes:
  pgdata:
  pgdata_test:

networks:
  remesa_network:
    driver: bridge
