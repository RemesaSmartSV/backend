version: '3.8'

services:
    # 1. Base de datos PostgreSQL (Desarrollo)
    postgres_db:
        image: postgres:16-alpine
        container_name: remesasmart_postgres
        restart: always
        environment:
            POSTGRES_DB: RemesaSmartDB
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123!}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - remesa_network

    # 2. Base de datos PostgreSQL (Pruebas)
    postgres_test_db:
        image: postgres:16-alpine
        container_name: remesasmart_postgres_test
        restart: always
        environment:
            POSTGRES_DB: RemesaSmartDB_Test
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123!}
        ports:
            - "5433:5432"
        volumes:
            - pgdata_test:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - remesa_network

    # 3. Backend .NET 8
    backend_api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: remesasmart_backend
        restart: on-failure
        depends_on:
            postgres_db:
                condition: service_healthy
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=RemesaSmartDB;Username=postgres;Password=${POSTGRES_PASSWORD:-SecretPassword123!}
            - ConnectionStrings__TestConnection=Host=postgres_test_db;Port=5432;Database=RemesaSmartDB_Test;Username=postgres;Password=${POSTGRES_PASSWORD:-SecretPassword123!}
        ports:
            - "8080:8080"
        networks:
            - remesa_network

    # 4. Frontend React
    frontend_web:
        build:
            context: ../frontend
            dockerfile: Dockerfile
        container_name: remesasmart_frontend
        restart: on-failure
        depends_on:
            - backend_api
        ports:
            - "5173:80"
        networks:
            - remesa_network

volumes:
    pgdata:
    pgdata_test:

networks:
    remesa_network:
        driver: bridge
        