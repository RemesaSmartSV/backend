name: CI Backend RemesaSmart

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar proyecto
        run: dotnet build --no-restore --configuration Release

      - name: Restaurar dependencias de tests
        if: hashFiles('RemesaSmartSV.Tests/RemesaSmartSV.Tests.csproj') != ''
        run: dotnet restore RemesaSmartSV.Tests/RemesaSmartSV.Tests.csproj

      - name: Ejecutar pruebas unitarias
        if: hashFiles('RemesaSmartSV.Tests/RemesaSmartSV.Tests.csproj') != ''
        run: dotnet test RemesaSmartSV.Tests/RemesaSmartSV.Tests.csproj --no-restore --configuration Release

      - name: Probar construccion de imagen Docker
        run: docker build -t remesasmart-backend:test .
        