name: Backend CI

on:
    push:
        branches: [ develop, main ]
    pull_request:
        branches: [ develop, main ]

jobs:
    build-and-test:
        name: Build, Test and Docker Check
        runs-on: ubuntu-latest

        steps:
            - name: Descargar codigo del repositorio
              uses: actions/checkout@v4

            - name: Configurar entorno .NET 8
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '8.0.x'

            - name: Restaurar dependencias
              run: dotnet restore

            - name: Compilar proyecto
              run: dotnet build --no-restore --configuration Release

            - name: Ejecutar pruebas unitarias xUnit
              run: dotnet test --no-build --configuration Release --verbosity normal

            - name: Probar construccion de imagen Docker
              run: docker build -t remesasmart-backend:test .
              